    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#ffffff", "font": {"color": "black"}, "id": "Switch2", "label": "Switch2", "shape": "dot", "size": 20, "title": "\n        Switch2\n        VLANs: [10]\n        "}, {"color": "#ffffff", "font": {"color": "black"}, "id": "Switch1", "label": "Switch1", "shape": "dot", "size": 20, "title": "\n        Switch1\n        VLANs: [10, 20]\n        "}, {"color": "#390062", "font": {"color": "black"}, "id": "User1", "label": "User1", "shape": "dot", "size": 20, "title": "\n        User1\n        VLANs: [10]\n        "}, {"color": "#390062", "font": {"color": "black"}, "id": "User2", "label": "User2", "shape": "dot", "size": 20, "title": "\n        User2\n        VLANs: [10]\n        "}, {"color": "#0cce35", "font": {"color": "black"}, "id": "User3", "label": "User3", "shape": "dot", "size": 20, "title": "\n        User3\n        VLANs: [20]\n        "}, {"color": "#0cce35", "font": {"color": "black"}, "id": "User4", "label": "User4", "shape": "dot", "size": 20, "title": "\n        User4\n        VLANs: [20]\n        "}]);
                  edges = new vis.DataSet([{"color": "gray", "from": "Switch2", "to": "User2"}, {"color": "gray", "from": "Switch2", "to": "Switch1"}, {"color": "gray", "from": "Switch1", "to": "User1"}, {"color": "gray", "from": "Switch1", "to": "User3"}, {"color": "gray", "from": "Switch1", "to": "User4"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "forceAtlas2Based": {
            "avoidOverlap": 0,
            "centralGravity": 0.01,
            "damping": 0.4,
            "gravitationalConstant": -50,
            "springConstant": 0.08,
            "springLength": 100
        },
        "solver": "forceAtlas2Based",
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
